[project]
name = "reversenui-backend"
version = "0.2.0"
description = "Local-first backend for ReversenUI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<1",
  "uvicorn[standard]>=0.51,<1",
  "pydantic>=2.13,<3",
  "python-multipart>=0.0.20,<1",
  "Pillow>=12.3,<13",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
